<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>أسرار ستوديو</title>
<style>
@font-face{font-family:T;src:url(/fonts/Tajawal-Medium.ttf);font-weight:500}
@font-face{font-family:T;src:url(/fonts/Tajawal-Bold.ttf);font-weight:700}
@font-face{font-family:T;src:url(/fonts/Tajawal-Black.ttf);font-weight:900}
:root{--bg:#F6F1E6;--bg2:#EFE6D2;--card:#FFFFFF;--line:#E6DAC2;--gold:#B8892B;--gold2:#8F6A1C;--goldbtn:#C9A04A;--txt:#1B1712;--mut:#7A6E5A;--ok:#2E9E52;--bad:#C8423B;
  --in:#FBF8F1;--sep:#EFE6D4;--selbg:#F7EDD6;--selbg2:#FBF3E2;--shadow:0 1px 2px rgba(60,40,10,.06),0 10px 30px rgba(60,40,10,.07);--glow:rgba(201,160,74,.18)}
[data-theme=dark]{--bg:#070707;--bg2:#0f0d0a;--card:#121110;--line:#2a2620;--gold:#D4A84B;--gold2:#F3D28C;--goldbtn:#D4A84B;--txt:#F7F1E4;--mut:#9b927f;--ok:#7bd88f;--bad:#ff6b6b;
  --in:var(--in);--sep:var(--sep);--selbg:var(--selbg);--selbg2:var(--selbg2);--shadow:0 10px 30px rgba(0,0,0,.35);--glow:rgba(212,168,75,.12)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:500 16px/1.6 T,system-ui,sans-serif;min-height:100vh;
  background-image:radial-gradient(1200px 500px at 85% -10%,var(--glow),transparent 60%),radial-gradient(900px 400px at 0% 0%,var(--glow),transparent 55%);background-attachment:fixed;transition:background-color .3s,color .3s}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 80px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:30px;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.hd-l{display:flex;gap:8px;align-items:center}
.mark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#E9C77A,#B8892B 60%,#8F6A1C);box-shadow:0 6px 18px rgba(184,137,43,.35);margin-inline-end:10px}
.mark svg{width:22px;height:22px}
.logo{display:flex;align-items:center}.logo small{display:block;font-size:11px;color:var(--mut);font-weight:500;letter-spacing:.3px}
.tgl{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--in);color:var(--txt);cursor:pointer;font-size:18px;display:grid;place-items:center}
.tgl:hover{border-color:var(--gold)}
.pill.on{color:var(--ok);border-color:var(--ok)}.pill.off{color:var(--bad);border-color:var(--bad);cursor:pointer;background:var(--selbg2)}
.cbar{display:none;align-items:center;justify-content:space-between;gap:12px;background:var(--selbg2);border:1px solid var(--gold);border-radius:16px;padding:12px 16px;margin:-14px 0 22px}
.cbar.show{display:flex}
.logo{font-weight:900;font-size:22px;line-height:1.1}.logo b{color:var(--gold)}
.pill{font-size:13px;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:4px 12px}
.btn{background:linear-gradient(180deg,#E2BE6E,var(--goldbtn));color:#1a1206;box-shadow:0 6px 16px rgba(184,137,43,.25);border:0;border-radius:14px;padding:12px 22px;font-weight:900;cursor:pointer}
.btn:hover{background:var(--gold2)}.btn:disabled{opacity:.4;cursor:default}
.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}.ghost:hover{background:var(--in)}
h1{font-weight:900;font-size:30px;margin:0 0 6px}h2{font-weight:900;font-size:20px;margin:0 0 14px}
.sub{color:var(--mut);margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.pc{cursor:pointer;transition:.15s}.pc:hover{border-color:var(--gold);transform:translateY(-2px)}
.pc .th{aspect-ratio:9/12;background:#000 center/cover;display:grid;place-items:center;color:var(--line);font-size:40px}
.pc .in{padding:12px 14px}.pc .nm{font-weight:700}
.st{font-size:13px;color:var(--mut)}.st.ok{color:var(--ok)}.st.run{color:var(--gold)}.st.error{color:var(--bad)}
.new{display:grid;place-items:center;min-height:260px;border:2px dashed var(--line);color:var(--mut);cursor:pointer;border-radius:22px;font-weight:700}
.new:hover{border-color:var(--gold);color:var(--gold)}
.box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;margin-bottom:18px;box-shadow:var(--shadow)}
.drop{border:2px dashed var(--line);border-radius:18px;padding:36px;text-align:center;color:var(--mut);cursor:pointer}
.drop.on{border-color:var(--gold);color:var(--gold)}
.files{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.f{background:var(--in);border-radius:10px;padding:6px 12px;font-size:14px}
label.q{display:block;font-weight:700;margin:18px 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{border:1px solid var(--line);border-radius:14px;padding:10px 16px;cursor:pointer;background:var(--in)}
.opt.on{border-color:var(--gold);background:var(--selbg);color:var(--gold2)}
.opt small{display:block;color:var(--mut);font-size:12px}
input[type=text],textarea{width:100%;background:var(--in);border:1px solid var(--line);border-radius:12px;padding:12px}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--gold)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.two{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;align-items:center;gap:12px;padding:10px 0;color:var(--mut)}
.steps i{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:13px;flex:none}
.steps li.done{color:var(--txt)}.steps li.done i{background:var(--gold);border-color:var(--gold);color:#111}
.steps li.now{color:var(--gold2);font-weight:700}.steps li.now i{border-color:var(--gold);animation:p 1.2s infinite}
.steps li.err{color:var(--bad)}.steps li.err i{border-color:var(--bad)}
@keyframes p{50%{box-shadow:0 0 0 6px #d4a84b33}}
.log{height:360px;overflow:auto;background:var(--in);border-radius:14px;padding:12px;font-size:14px}
.log div{padding:4px 0;border-bottom:1px solid var(--sep)}
.log .claude{color:var(--gold2)}.log .claude:before{content:"Claude: ";font-weight:900;color:var(--gold)}
.log .tool{color:var(--mut);font-size:12px;direction:ltr;text-align:left}
.log .user{color:#9cd2ff}.log .user:before{content:"أنت: ";font-weight:900}
.log .error{color:var(--bad)}.log .debug{display:none}
video{width:100%;border-radius:16px;background:#000;max-height:70vh}
.prev{width:100%;border-radius:12px;margin-top:10px}
.outs a{display:flex;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-top:8px}
.outs a:hover{border-color:var(--gold)}
.ask{display:flex;gap:10px;margin-top:12px}.ask textarea{height:52px;resize:vertical}
.err{background:#2a1212;border:1px solid #5a2222;color:#ffb3b3;border-radius:12px;padding:10px 14px;margin:10px 0}
.empty{color:var(--mut);text-align:center;padding:40px}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tab{padding:8px 16px;border-radius:12px;cursor:pointer;color:var(--mut);border:1px solid transparent}
.tab.on{color:var(--gold2);border-color:var(--gold);background:var(--selbg)}
.sent{padding:10px 0;border-bottom:1px solid var(--sep);display:flex;gap:10px;align-items:flex-start}
.sent .tm{color:var(--mut);font-size:12px;direction:ltr;min-width:42px;cursor:pointer}
.sent .ws{flex:1;line-height:2}.w{cursor:pointer;border-radius:6px;padding:1px 3px}.w:hover{background:var(--selbg)}
.w.hot{color:#111;background:var(--gold)}
.mini{background:none;border:1px solid var(--line);border-radius:9px;color:var(--mut);padding:3px 9px;cursor:pointer;font-size:12px}
.mini:hover{color:var(--bad);border-color:var(--bad)}
.el{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--sep)}
.el .k{font-size:12px;color:var(--gold)}.el .k small{display:block;color:var(--mut);direction:ltr;text-align:right}
.el input{padding:7px 10px!important;font-size:14px;margin:2px 0}
.nt{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--sep)}.nt.done{opacity:.5}
.nt .tm{direction:ltr;color:var(--gold);cursor:pointer;min-width:42px}.nt .tx{flex:1}
.dirty{background:var(--selbg);border:1px solid var(--gold);border-radius:14px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.clip{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:14px;border:1px solid var(--line);border-radius:16px;margin-bottom:10px;cursor:pointer}
.clip.on{border-color:var(--gold);background:var(--selbg2)}.clip .sc{font-weight:900;font-size:26px;color:var(--gold);min-width:56px;text-align:center}
.clip .sc small{display:block;font-size:11px;color:var(--mut);font-weight:500}.clip h4{margin:0 0 4px;font-size:16px}
.clip .hk{color:var(--gold2);font-size:14px}.clip .wy{color:var(--mut);font-size:13px}
.chk{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--sep)}.chk b.ok{color:var(--ok)}.chk b.warn{color:#ffb84d}.chk b.bad{color:var(--bad)}
.pk{margin-bottom:14px}.pk label{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px}
.pk pre{white-space:pre-wrap;background:var(--in);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0;font:inherit;font-size:14px}
.prod{display:flex;gap:12px;align-items:center;background:var(--in);border:1px solid var(--line);border-radius:14px;padding:10px;margin:12px 0}
.prod img{width:64px;height:64px;object-fit:cover;border-radius:10px}.prod b{display:block}
.scr{border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px;cursor:pointer}.scr.on{border-color:var(--gold);background:var(--selbg2)}
.scr .top{display:flex;gap:12px;align-items:center}.scr .sc{font-weight:900;font-size:24px;color:var(--gold)}
.scr pre{white-space:pre-wrap;font:inherit;font-size:14px;color:var(--mut);margin:10px 0 0;display:none}.scr.on pre{display:block}
.tp{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column}
.tp video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35;transform:scaleX(-1);border-radius:0;max-height:none}
.tp .txt{position:relative;flex:1;overflow:hidden;padding:0 8vw}
.tp .roll{font-weight:900;font-size:clamp(28px,4.4vw,56px);line-height:1.6;text-align:center;padding:40vh 0 60vh;text-shadow:0 2px 12px #000}
.tp .bar{position:relative;display:flex;gap:10px;align-items:center;justify-content:center;padding:14px;background:#000a;flex-wrap:wrap}
.tp .rec{background:#e5383b;color:#fff}.tp .dot{width:10px;height:10px;border-radius:50%;background:#e5383b;display:inline-block;animation:p 1s infinite}
.tp .line{position:absolute;top:38vh;left:0;right:0;height:2px;background:#d4a84b55}
.tl{margin-top:14px;user-select:none}.tl .trk{position:relative;height:46px;margin-bottom:6px;border-radius:8px;overflow:hidden;background:var(--in);cursor:pointer}
.tl .lbl{position:absolute;right:6px;top:3px;font-size:10px;color:var(--mut);z-index:3;background:#000a;padding:0 5px;border-radius:5px}
.tl .img{position:absolute;inset:0;background-size:100% 100%;opacity:.85}
.tl .blk{position:absolute;top:8px;bottom:8px;border-radius:6px;font-size:11px;padding:0 6px;white-space:nowrap;overflow:hidden;line-height:30px;color:#111}
.tl .cap{background:#e98a5b}.tl .el{background:var(--gold)}.tl .sel{position:absolute;top:0;bottom:0;background:#ff5b5b44;border:1px solid #ff5b5b;z-index:4;pointer-events:none}
.tl .ph{position:absolute;top:0;bottom:0;width:2px;background:#ff5b5b;z-index:5;pointer-events:none}
.tl .ruler{display:flex;justify-content:space-between;font-size:10px;color:var(--mut);direction:ltr;margin-bottom:4px}
.tlbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.filt{display:flex;gap:8px;margin:-8px 0 18px;flex-wrap:wrap}.filt span{padding:6px 14px;border:1px solid var(--line);border-radius:99px;cursor:pointer;color:var(--mut);font-size:14px}
.filt span.on{border-color:var(--gold);color:var(--gold2);background:var(--selbg)}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--selbg);color:var(--gold2);margin:4px 0 0 4px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--gold);border-top-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px}@keyframes sp{to{transform:rotate(360deg)}}
.hint{color:var(--mut);font-size:13px;margin:0 0 10px}
@media(max-width:800px){.two,.row{grid-template-columns:1fr}}
</style>
<link rel="stylesheet" href="/web/offer.css">
<link rel="stylesheet" href="/web/editor.css">
<script src="/web/editor.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="/"><span class="mark"><svg viewBox="0 0 24 24" fill="#1a1206"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4zm-7 11.5v-5l4 2.5-4 2.5z"/></svg></span>
      <span>أسرار <b>ستوديو</b><small>من أسرار الرقمية</small></span></a>
    <div class="hd-l"><span class="pill" id="cl">…</span><button class="tgl" id="tgl" title="الوضع الفاتح / الداكن">☾</button></div>
  </header>
  <div class="cbar" id="cbar"><span>⚠️ <b>Claude مو متصل</b> — سجّل دخول باشتراكك عشان يشتغل المونتاج (مرة وحدة بس).</span>
    <button class="btn" id="cbtn" style="padding:9px 18px">سجّل دخول Claude</button></div>
  <main id="app"></main>
</div>
<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api = async (u, o = {}) => { const r = await fetch(u, o); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || 'خطأ'); return j; };
const post = (u, b) => api(u, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(b || {})});
const STL = {upload: 'بانتظار المقاطع', transcribe: 'تفريغ', cut: 'قص', plan: 'Claude يخطط', preview: 'معاينة', render: 'تصدير', done: 'جاهز'};
let timer = null;

// الوضع الفاتح/الداكن (الافتراضي فاتح)
const setTheme = t => { document.documentElement.dataset.theme = t; try { localStorage.setItem('asrarTheme', t); } catch {} $('#tgl').textContent = t === 'dark' ? '☀' : '☾'; };
let TH = 'light'; try { TH = localStorage.getItem('asrarTheme') || 'light'; } catch {}
setTheme(TH); $('#tgl').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
// حالة Claude: متصل/مو متصل + زر تسجيل الدخول
let CLAUDE_OK = true, loginWait = null;
async function ping() {
  const p = await api('/api/ping').catch(() => null); if (!p) return;
  CLAUDE_OK = !!p.loggedIn;
  const c = $('#cl'); c.className = 'pill ' + (CLAUDE_OK ? 'on' : 'off');
  c.textContent = !p.claude ? '○ Claude Code غير مثبت' : CLAUDE_OK ? '● Claude متصل' : '○ Claude مو متصل — اضغط';
  $('#cbar').classList.toggle('show', p.claude && !CLAUDE_OK);
  if (CLAUDE_OK && loginWait) { clearInterval(loginWait); loginWait = null; }
  if (CLAUDE_OK && window.onClaudeBack) onClaudeBack();
  return p;
}
async function claudeLogin() {
  try { await post('/api/claude/login'); } catch (e) { alert(e.message); return; }
  $('#cbar').innerHTML = '<span><span class="spin"></span> انفتحت لك نافذة تسجيل الدخول — سجّل بحسابك واضغط <b>Authorize</b>. إذا طلب كود، الصقه في النافذة السوداء واضغط Enter. أكمّل تلقائياً أول ما تسجّل.</span>';
  clearInterval(loginWait); loginWait = setInterval(ping, 3000);
}
$('#cbtn').onclick = claudeLogin; $('#cl').onclick = () => !CLAUDE_OK && claudeLogin();
ping(); setInterval(ping, 30000);
function gate() {
  window.GATED = true; clearInterval(timer);
  $('#app').innerHTML = `<div class="box" style="max-width:460px;margin:40px auto;text-align:center">
    <div style="font-size:44px">🔑</div><h1>تجربة بالدعوة</h1>
    <p class="sub">أسرار ستوديو الحين بتجربة مغلقة. حط كود الدعوة اللي وصلك عشان تفعّله.</p>
    <input type="text" id="ic" dir="ltr" placeholder="ASRAR-XXXX-XXXX" style="text-align:center;font-size:20px;letter-spacing:2px">
    <button class="btn" id="ib" style="width:100%;margin-top:12px">فعّل</button><div id="ie" class="err" hidden></div>
    <p class="hint" style="margin-top:16px">ما عندك كود؟ اطلبه من قروب أسرار الرقمية على التليقرام.</p></div>`;
  $('#ib').onclick = async () => {
    try { await post('/api/invite', {code: $('#ic').value}); location.href = '/'; }
    catch (e) { $('#ie').hidden = false; $('#ie').textContent = e.message; }
  };
  $('#ic').onkeydown = e => e.key === 'Enter' && $('#ib').click();
}

function route() {
  clearInterval(timer); if (window.GATED) return gate();
  const m = location.pathname.match(/^\/p\/(.+)$/);
  m ? project(decodeURIComponent(m[1])) : library();
}
window.onpopstate = route;
window.onEditorClose = () => route();
function go(u) { history.pushState(0, '', u); route(); }

// ─────────── المكتبة ───────────
const kind = p => p.running || p.status.state === 'run' ? 'run' : p.status.stage === 'done' && p.status.state === 'ok' ? 'ok' : 'wait';
async function library() {
  const list = await api('/api/projects');
  if (window.GATED) return;
  $('#app').innerHTML = `
    <h1>مشاريعك</h1><p class="sub">كل شي يشتغل على جهازك — ارفع مقاطعك و Claude يسوي المونتاج.</p>
    <div class="filt">${[['all', 'الكل'], ['wait', 'ينتظرك'], ['run', 'شغّال'], ['ok', 'جاهز'], ['long', 'بودكاست']].map(([k, t]) =>
      `<span data-f="${k}" class="${(window.FLT || 'all') === k ? 'on' : ''}">${t} ${k === 'all' ? list.length : list.filter(p => kind(p) === k || (k === 'long' && p.brief.mode === 'clips')).length}</span>`).join('')}</div>
    <div class="grid">
      <div class="new" id="nw"><div style="text-align:center"><div style="font-size:42px">+</div>مشروع جديد</div></div>
      ${list.filter(p => { const f = window.FLT || 'all'; return f === 'all' || (f === 'long' ? p.brief.mode === 'clips' : kind(p) === f); }).map(p => `
        <div class="card pc" data-n="${esc(p.name)}">
          <div class="th" style="${p.thumb ? `background-image:url('/files/${encodeURIComponent(p.name)}/thumb.jpg')` : ''}">${p.thumb ? '' : '🎬'}</div>
          <div class="in"><div class="nm">${esc(p.name)}</div>
          <div class="st ${p.status.state}">${p.status.state === 'error' ? '⚠️ توقف' : STL[p.status.stage] || ''}${p.outputs.length ? ' · ' + p.outputs.length + ' ملفات' : ''}</div></div>
        </div>`).join('')}
    </div>`;
  $('#nw').onclick = async () => {
    const name = prompt('اسم المشروع:', 'مقطع جديد'); if (!name) return;
    const r = await post('/api/projects', {name}); go('/p/' + encodeURIComponent(r.name));
  };
  document.querySelectorAll('.filt span').forEach(e => e.onclick = () => { window.FLT = e.dataset.f; library(); });
  document.querySelectorAll('.pc').forEach(c => c.onclick = () => go('/p/' + encodeURIComponent(c.dataset.n)));
}

// ─────────── المشروع ───────────
async function project(name) {
  const P = await api('/api/projects/' + encodeURIComponent(name));
  if (P.status.stage === 'upload') return setup(P);
  progress(P);
}

// صفحة الرفع + الأسئلة
function setup(P) {
  const b = Object.assign({mode: 'short', editor: 'claude', count: 5, dur: '30-60', picker: 'me', frame: 'crop', aspects: [], style: 'editorial', type: 'شرح أداة', platform: 'tiktok', title: P.name, end: '', account: '@asrar_rg', notes: ''}, P.brief);
  const opt = (k, v, t, s = '') => `<div class="opt ${String(b[k]) === String(v) ? 'on' : ''}" data-k="${k}" data-v="${esc(v)}">${t}${s ? `<small>${s}</small>` : ''}</div>`;
  $('#app').innerHTML = `
    <h1>${esc(P.name)}</h1><p class="sub">ارفع المقاطع وجاوب على الأسئلة — بعدها اضغط «ابدأ المونتاج».</p>
    ${P.status.error ? `<div class="err">${esc(P.status.error)}</div>` : ''}
    <div class="box" id="adbox" ${b.mode === 'ad' ? '' : 'hidden'}><h2>إعلان من رابط ⭐</h2>
      <p class="hint">حط رابط منتجك (سلة، زد، أو أي متجر) — Claude يقرأه ويكتب لك 3 سكربتات، تختار واحد وتصوّره بالملقّن.</p>
      <div class="ask"><input type="text" id="purl" dir="ltr" placeholder="https://…" value="${esc((P.product || {}).url || '')}"><button class="btn" id="pgo">اقرأ المنتج</button></div>
      <div class="hint" id="pmsg" style="margin-top:8px">${P.running ? esc(P.status.msg) : ''}</div><div id="pout"></div></div>
    <div class="box"><h2>١. المقاطع</h2>
      <div class="drop" id="dz">اسحب مقاطعك هنا أو اضغط للاختيار<br><small>تنرتب حسب ترتيب الاختيار</small></div>
      <input type="file" id="fi" accept="video/*" multiple hidden>
      <div class="ask" style="margin-top:14px"><input type="text" id="yt" placeholder="أو الصق رابط: يوتيوب، تيك توك، إنستقرام، X، سناب…" dir="ltr"><button class="btn ghost" id="ytb">نزّل</button></div>
      <div class="hint" id="ytm" style="margin-top:8px"></div>
      <div class="files" id="fl">${P.inputs.map(f => `<span class="f">✅ ${esc(f.replace(/^\d+_/, ''))}</span>`).join('')}</div>
    </div>
    <div class="box"><h2>٢. الأسئلة</h2>
      <label class="q">وش عندك؟</label><div class="opts">
        ${opt('mode', 'short', '🪄 مقطع قصير', 'مونتاج كامل')}${opt('mode', 'clips', '✂️ بودكاست / فيديو طويل', 'أطلّع منه أقوى المقاطع بدرجات')}${opt('mode', 'ad', 'إعلان منتج ⭐', 'من رابط متجرك: سكربت + ملقّن + مونتاج')}</div>
      <div id="o-short" ${b.mode === 'short' ? '' : 'hidden'}><label class="q">مين يمنتجه؟</label><div class="opts">
        ${opt('editor', 'claude', '🪄 Claude يمنتجه', 'مونتاج كامل بأسلوبك — يسألك قبل')}${opt('editor', 'self', '✋ أمنتجه بنفسي', 'يقص السكتات ويكتب الكابشن، وتكمّل بالاستوديو')}</div></div>
      <div id="o-clips" ${b.mode === 'clips' ? '' : 'hidden'}>
        <label class="q">كم ريل تبي؟</label><div class="opts">${[3, 5, 8, 10].map(n => opt('count', n, n)).join('')}</div>
        <label class="q">طول كل ريل</label><div class="opts">${opt('dur', '15-30', '15–30 ث')}${opt('dur', '30-60', '30–60 ث')}${opt('dur', '60-90', '60–90 ث')}</div>
        <label class="q">مين يختار اللقطات؟</label><div class="opts">${opt('picker', 'claude', '🪄 Claude يختار الأقوى', 'ويصنعها مباشرة')}${opt('picker', 'me', '👆 أنا أختار', 'يرشّح لي بدرجات وأختار')}</div>
      </div>
      <label class="q">نوع المقطع</label><div class="opts">
        ${['شرح أداة', 'إعلان', 'قصة', 'نصيحة', 'خبر'].map(v => opt('type', v, v)).join('')}</div>
      <label class="q">الستايل</label><div class="opts">
        ${[['editorial', 'إديتوريال', 'جريء', '#0E0E0E,#FF6B1A,#D7FF3A'], ['gold', 'ذهبي فاخر', 'فخم', '#070707,#D4A84B,#F3D28C'], ['amber', 'ليلي كهرماني', 'هادي', '#0B1020,#7C5CFF,#FFB547'],
          ['teal', 'بحر فيروزي', 'تقني', '#04161C,#1E90FF,#2EE6D6'], ['sunset', 'غروب', 'دافي', '#1A0B12,#FF2E63,#FF9F45'], ['neon', 'أسود ونيون', 'حماسي', '#050505,#00E5FF,#39FF14'], ['mono', 'أسود وأبيض', 'بسيط', '#0A0A0A,#8A8A8A,#FFFFFF']]
          .map(([k, t, d, c]) => opt('style', k, t + `<span style="display:flex;height:5px;border-radius:9px;overflow:hidden;margin-top:6px">${c.split(',').map(x => `<b style="flex:1;background:${x}"></b>`).join('')}</span>`, d)).join('')}</div>
      <label class="q">المنصة الأساسية</label><div class="opts">
        ${opt('platform', 'tiktok', 'تيك توك / ريلز')}${opt('platform', 'x', 'X')}</div>
      <label class="q">إذا الفيديو عرضي (يوتيوب، بودكاست)</label><div class="opts">
        ${opt('frame', 'crop', 'قص للطول', 'يملا الشاشة — يقص الأطراف')}${opt('frame', 'fit', 'كامل بالنص', 'ما ينقص شي — خلفية مغبّشة')}</div>
      <label class="q">مقاسات إضافية (9:16 دايم موجود)</label><div class="opts">
        ${[['4x5', 'إنستقرام 4×5'], ['1x1', 'مربع 1×1']].map(([v, t]) => `<div class="opt asp ${b.aspects.includes(v) ? 'on' : ''}" data-a="${v}">${t}</div>`).join('')}</div>
      <div class="row">
        <div><label class="q">عنوان المقطع</label><input type="text" id="title" value="${esc(b.title)}"></div>
        <div><label class="q">اسم الحساب</label><input type="text" id="account" value="${esc(b.account)}"></div>
      </div>
      <label class="q">نص النهاية (اختياري)</label><input type="text" id="end" value="${esc(b.end)}" placeholder="مثال: تابعني لأسرار أكثر">
      <label class="q">ملاحظات لـ Claude (اختياري)</label><textarea id="notes" rows="3" placeholder="مثال: ركّز على الأرقام، وخلّ الهوك قوي">${esc(b.notes)}</textarea>
    </div>
    <button class="btn" id="go" ${P.inputs.length ? '' : 'disabled'}>ابدأ المونتاج 🎬</button>`;
  document.querySelectorAll('.opt.asp').forEach(o => o.onclick = () => {
    const a = o.dataset.a; b.aspects = b.aspects.includes(a) ? b.aspects.filter(x => x !== a) : [...b.aspects, a]; o.classList.toggle('on');
  });
  document.querySelectorAll('.opt:not(.asp)').forEach(o => o.onclick = () => {
    b[o.dataset.k] = o.dataset.v;
    if (o.dataset.k === 'mode') { $('#adbox').hidden = o.dataset.v !== 'ad'; $('#o-short').hidden = o.dataset.v !== 'short'; $('#o-clips').hidden = o.dataset.v !== 'clips'; }
    if (o.dataset.k === 'count') b.count = +o.dataset.v;
    document.querySelectorAll(`.opt[data-k="${o.dataset.k}"]`).forEach(x => x.classList.toggle('on', x === o));
  });
  const dz = $('#dz'), fi = $('#fi');
  dz.onclick = () => fi.click();
  dz.ondragover = e => { e.preventDefault(); dz.classList.add('on'); };
  dz.ondragleave = () => dz.classList.remove('on');
  dz.ondrop = e => { e.preventDefault(); dz.classList.remove('on'); upload([...e.dataTransfer.files]); };
  fi.onchange = () => upload([...fi.files]);
  let n = P.inputs.length;
  async function upload(files) {
    for (const f of files.filter(f => f.type.startsWith('video/') || /\.(mp4|mov|mkv|webm)$/i.test(f.name))) {
      const el = document.createElement('span'); el.className = 'f'; $('#fl').append(el);
      await new Promise((ok, bad) => {
        const x = new XMLHttpRequest();
        x.open('PUT', `/api/projects/${encodeURIComponent(P.name)}/upload?i=${n++}&file=${encodeURIComponent(f.name)}`);
        x.upload.onprogress = e => el.textContent = `⏳ ${f.name} ${Math.round(e.loaded / e.total * 100)}%`;
        x.onload = () => { el.textContent = '✅ ' + f.name; ok(); };
        x.onerror = () => { el.textContent = '❌ ' + f.name; bad(); };
        x.send(f);
      }).catch(() => {});
    }
    $('#go').disabled = !$('#fl').children.length;
  }
  // ── إعلان من رابط ──
  const PN = encodeURIComponent(P.name);
  function drawAd(Q) {
    const pr = Q.product || {}, sc = Q.scripts || [];
    if (!pr.title && !sc.length) return;
    $('#pout').innerHTML = (pr.title ? `<div class="prod">${(pr.images || [])[0] ? `<img src="/files/${PN}/${pr.images[0]}">` : ''}
        <div><b>${esc(pr.title)}</b><span class="hint">${pr.price ? esc(pr.price + ' ' + (pr.currency || '')) + ' · ' : ''}${(pr.images || []).length} صور للمونتاج</span></div></div>` : '') +
      sc.map(x => `<div class="scr ${b.script === x.id ? 'on' : ''}" data-id="${x.id}"><div class="top"><span class="sc">${x.score}</span>
        <div><b>${esc(x.angle)}</b><div style="color:var(--gold2)">«${esc(x.hook)}»</div></div></div><pre>${esc(x.script)}</pre></div>`).join('') +
      (sc.length ? `<div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap"><button class="btn" id="tpgo" ${b.script ? '' : 'disabled'}>📖 ملقّن وصوّر هنا</button>
        <span class="hint" style="align-self:center">أو صوّر بجوالك وارفع المقطع تحت 👇</span></div>` : '');
    $('#pout').querySelectorAll('.scr').forEach(e => e.onclick = () => { b.script = +e.dataset.id; drawAd(Q); });
    if ($('#tpgo')) $('#tpgo').onclick = () => prompter(sc.find(x => x.id === b.script));
  }
  drawAd(P);
  async function pollAd() {
    const iv = setInterval(async () => {
      const q = await api(`/api/projects/${PN}`).catch(() => null); if (!q) return;
      $('#pmsg').textContent = q.status.error || q.status.msg || '';
      if (!q.running) { clearInterval(iv); $('#pgo').disabled = false; drawAd(q); }
    }, 1500);
  }
  if (P.running) pollAd();
  $('#pgo').onclick = async () => {
    const url = $('#purl').value.trim(); if (!url) return;
    $('#pgo').disabled = true;
    try { await post(`/api/projects/${PN}/product`, {url}); pollAd(); } catch (e) { alert(e.message); $('#pgo').disabled = false; }
  };
  // الملقّن + التصوير بالكاميرا
  async function prompter(x) {
    const d = document.createElement('div'); d.className = 'tp';
    d.innerHTML = `<video autoplay muted playsinline></video><div class="line"></div>
      <div class="txt"><div class="roll">${esc(x.script).replace(/\n/g, '<br>')}</div></div>
      <div class="bar"><button class="btn rec" id="rc">● ابدأ التصوير</button>
        <label class="hint" style="margin:0">السرعة <input type="range" id="sp" min="10" max="120" value="45"></label>
        <button class="btn ghost" id="tpx">إغلاق</button><span id="tps" class="hint" style="margin:0"></span></div>`;
    document.body.append(d);
    const v = d.querySelector('video'), roll = d.querySelector('.roll'), box = d.querySelector('.txt');
    let stream = null, rec = null, chunks = [], run = false, y = 0, last = 0;
    try { stream = await navigator.mediaDevices.getUserMedia({video: {width: 1080, height: 1920, facingMode: 'user'}, audio: true}); v.srcObject = stream; }
    catch { $('#tps').textContent = 'ما قدرت أفتح الكاميرا — استخدم الملقّن وصوّر بجوالك'; $('#rc').textContent = '▶ شغّل النص'; $('#rc').classList.remove('rec'); }
    (function loop(t) { if (!d.isConnected) return; if (run) { y += (t - last) / 1000 * +$('#sp').value; box.scrollTop = y; } last = t; requestAnimationFrame(loop); })(0);
    const close = () => { stream && stream.getTracks().forEach(t => t.stop()); d.remove(); };
    $('#tpx').onclick = () => { if (rec && rec.state === 'recording') rec.stop(); else close(); };
    $('#rc').onclick = () => {
      if (!stream) { run = !run; $('#rc').textContent = run ? '⏸ وقّف' : '▶ شغّل النص'; return; }
      if (rec && rec.state === 'recording') { rec.stop(); return; }
      chunks = []; y = 0; box.scrollTop = 0;
      rec = new MediaRecorder(stream, {mimeType: MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus') ? 'video/webm;codecs=vp9,opus' : 'video/webm'});
      rec.ondataavailable = e => e.data.size && chunks.push(e.data);
      rec.onstop = async () => {
        run = false; $('#tps').textContent = 'أرفع التصوير…';
        const f = new File(chunks, `تصوير-${Date.now()}.webm`, {type: 'video/webm'});
        close(); await upload([f]);
      };
      setTimeout(() => { run = true; }, 1200);   // ثانية قبل ما يمشي النص
      rec.start(1000); $('#rc').innerHTML = '<span class="dot"></span> وقّف التصوير';
    };
  }
  $('#ytb').onclick = async () => {
    const url = $('#yt').value.trim(); if (!url) return;
    $('#ytb').disabled = true;
    try { await post(`/api/projects/${encodeURIComponent(P.name)}/grab`, {url}); } catch (e) { alert(e.message); $('#ytb').disabled = false; return; }
    if (/youtu|tiktok|instagram|twitch|x\.com|twitter|snapchat/.test(url) && b.mode === 'short') { b.mode = 'clips'; document.querySelectorAll('.opt[data-k="mode"]').forEach(x => x.classList.toggle('on', x.dataset.v === 'clips')); $('#o-short').hidden = true; $('#o-clips').hidden = false; }
    const iv = setInterval(async () => {
      const q = await api(`/api/projects/${encodeURIComponent(P.name)}`).catch(() => null); if (!q) return;
      $('#ytm').textContent = q.status.msg || '';
      if (!q.running) {
        clearInterval(iv); $('#ytb').disabled = false;
        if (q.inputs.length) { $('#fl').innerHTML = q.inputs.map(f => `<span class="f">✅ ${esc(f.replace(/^\d+_/, ''))}</span>`).join(''); $('#go').disabled = false; }
      }
    }, 1500);
  };
  $('#go').onclick = async () => {
    ['title', 'account', 'end', 'notes'].forEach(k => b[k] = $('#' + k).value.trim());
    $('#go').disabled = true; $('#go').textContent = 'أجهّز المقاطع…';
    try {
      await post(`/api/projects/${encodeURIComponent(P.name)}/brief`, b);
      $('#go').innerHTML = '<span class="spin"></span> أبدأ…';
      await post(`/api/projects/${encodeURIComponent(P.name)}/start`, {from: 'transcribe'});
      project(P.name);
    } catch (e) { alert(e.message); $('#go').disabled = false; $('#go').textContent = 'ابدأ المونتاج 🎬'; }
  };
}

// صفحة التقدم المباشر
async function progress(P) {
  const N = encodeURIComponent(P.name);
  const stages = await api(`/api/projects/${N}/stages`);
  $('#app').innerHTML = `
    <h1>${esc(P.name)}</h1><p class="sub" id="msg"></p>
    <div class="two">
      <div>
        <div class="box"><h2>المراحل</h2><ul class="steps" id="steps"></ul>
          <div id="actions" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"></div></div>
      </div>
      <div>
        <div class="box" id="result" hidden></div>
        <div class="box" id="clips" hidden></div>
        <div class="box" id="studio" hidden><h2>الاستوديو</h2><div id="dbar"></div>
          <div class="tabs"><span class="tab on" data-t="text">النص</span><span class="tab" data-t="els">العناصر</span><span class="tab" data-t="notes">الملاحظات</span><span class="tab" data-t="check">فحص</span><span class="tab" data-t="pack">النشر</span></div>
          <div id="pane"></div></div>
        <div class="box"><h2>سجل العمل</h2><div class="log" id="log"></div>
          <div class="ask"><textarea id="ask" placeholder="اطلب تعديل… مثال: كبّر الكابشن شوي، واحذف أول ٣ ثواني"></textarea>
          <button class="btn" id="send">نفّذ</button></div></div>
      </div>
    </div>`;
  let since = 0, lastKey = '';
  $('#send').onclick = async () => {
    const t = $('#ask').value.trim(); if (!t) return;
    try { await post(`/api/projects/${N}/ask`, {text: t}); $('#ask').value = ''; tick(); } catch (e) { alert(e.message); }
  };
  async function tick() {
    let p; try { p = await api(`/api/projects/${N}`); } catch { return; }
    const st = p.status, idx = stages.findIndex(s => s[0] === st.stage);
    const el = st.since ? Math.max(0, Math.floor(Date.now() / 1000 - st.since)) : 0;
    $('#msg').innerHTML = (st.state === 'run' ? '<span class="spin"></span> ' : '') + esc(st.msg || '') +
      (st.state === 'run' && st.since ? ` <span style="color:var(--mut)">· ${Math.floor(el / 60)}:${String(el % 60).padStart(2, '0')}</span>` : '') +
      (st.state === 'run' && st.stage === 'transcribe' ? '<br><span class="hint">التفريغ أطول خطوة — تقريباً نص مدة الفيديو. تقدر تسكّر الصفحة، الشغل يكمل.</span>' : '');
    $('#steps').innerHTML = stages.map(([k, t], i) => {
      let c = i < idx || st.stage === 'done' ? 'done' : i === idx ? (st.state === 'error' ? 'err' : st.state === 'run' ? 'now' : 'done') : '';
      return `<li class="${c}"><i>${c === 'done' ? '✓' : c === 'err' ? '!' : i + 1}</i>${t}</li>`;
    }).join('');
    if (st.state === 'error' && /Claude مو متصل|تسجيل دخول Claude/.test(st.msg || '') && !p.running && !window.onClaudeBack) {
      window.onClaudeBack = () => { window.onClaudeBack = null; post(`/api/projects/${N}/start`, {from: st.stage === 'upload' ? 'transcribe' : st.stage}).then(tick).catch(() => {}); };
    }
    const act = $('#actions');
    const key = st.state + p.running;
    if (key !== lastKey) {
      lastKey = key; if (!p.running) loadDoc();
      act.innerHTML = '';
      const b = (t, f, g) => { const e = document.createElement('button'); e.className = 'btn' + (g ? ' ghost' : ''); e.textContent = t; e.onclick = f; act.append(e); };
      if (!p.running && st.state === 'error') b('أعد المحاولة من هنا', () => post(`/api/projects/${N}/start`, {from: st.stage === 'upload' ? 'transcribe' : st.stage}).then(tick).catch(e => alert(e.message)));
      if (!p.running) b('↩️ تراجع', () => post(`/api/projects/${N}/undo`).then(() => alert('رجّعت آخر نسخة — اضغط «أعد التصدير»')).catch(e => alert(e.message)), 1);
      if (!p.running && st.stage === 'done') b('أعد التصدير', () => post(`/api/projects/${N}/start`, {from: 'preview'}).then(tick), 1);
      if (!p.running && p.status.stage !== 'upload' && !(p.brief.mode === 'clips' && !p.outputs.length)) b('🎬 افتح المحرر', () => openEditor(P.name));
      if (p.outputs.length) b('📂 افتح المجلد', () => post(`/api/projects/${N}/open`), 1);
    }
    $('#send').disabled = p.running;
    const r = $('#result');
    const prevKey = (p.outputs.join() || '') + (p.preview || '') + st.stage;
    if (r.dataset.k !== prevKey) {
      r.dataset.k = prevKey;
      const main = p.outputs.find(o => o.includes('تيك')) || p.outputs[0];
      if (main && st.stage === 'done') {
        r.hidden = false; setTimeout(() => coursePop('done'), 2500); setTimeout(() => D && drawTL(), 50);
        r.innerHTML = `<h2>الفيديو جاهز 🎬</h2><video id="vid" controls src="/files/${N}/out/${encodeURIComponent(main)}?v=${Date.now()}"></video><div id="tl"></div>
          <div class="outs">${p.outputs.map(o => `<a href="/files/${N}/out/${encodeURIComponent(o)}?download=1"><span>${esc(o)}</span><span>⬇️ تحميل</span></a>`).join('')}</div>`;
      } else if (p.preview) {
        r.hidden = false;
        r.innerHTML = `<h2>المعاينة</h2><img class="prev" src="/files/${N}/preview.jpg?v=${Date.now()}">`;
      }
    }
    const lg = await api(`/api/projects/${N}/log?since=${since}`).catch(() => []);
    if (lg.length) {
      const box = $('#log'), atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
      lg.forEach(e => { since = Math.max(since, e.t); const d = document.createElement('div'); d.className = e.who; d.textContent = e.text; box.append(d); });
      if (atEnd) box.scrollTop = box.scrollHeight;
    }
  }

  // ─── الاستوديو: النص · العناصر · الملاحظات ───
  let D = null, tab = 'text';
  const vid = () => $('#vid'), now = () => vid() ? vid().currentTime : 0;
  const seek = t => { const v = vid(); if (v) { v.currentTime = t; v.play(); } };
  const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => { tab = t.dataset.t; document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t)); draw(); });
  async function loadDoc() {
    D = await api(`/api/projects/${N}/doc`).catch(() => null);
    if (D && D.clips.length && !(D.caps.words || []).length) return drawClips();
    if (!D || !(D.caps.words || []).length) return;
    $('#studio').hidden = false; draw();
  }
  function bar() {
    $('#dbar').innerHTML = D.dirty ? `<div class="dirty"><span>عندك تعديلات ما انطبقت</span><button class="btn" id="rb">طبّق وأعد التصدير</button></div>` : '';
    if (D.dirty) $('#rb').onclick = () => post(`/api/projects/${N}/rebuild`).then(() => { D.dirty = false; bar(); tick(); }).catch(e => alert(e.message));
  }
  // التايم لاين: لقطات + موجة الصوت + الكابشن + العناصر، مع قص يدوي
  let SEL = null;
  function drawTL() {
    const box = $('#tl'); if (!box || !D || !D.tl) return;
    const tot = D.caps.total || 1, pc = t => (t / tot * 100).toFixed(3) + '%';
    const T = D.timeline || {}, els = [];
    Object.entries(KINDS).forEach(([k, [lb, tk, fs]]) => (T[k] || []).forEach(e => els.push({t: e[tk] || 0, e2: e.until ?? e.b ?? (e[tk] || 0) + 1.5, txt: e[fs[0]] || lb})));
    box.innerHTML = `<div class="tl"><div class="ruler">${[0, .25, .5, .75, 1].map(k => `<span>${fmt(tot * k)}</span>`).join('')}</div>
      <div class="trk" data-trk><span class="lbl">العناصر</span>${els.map(x => `<div class="blk el" style="right:auto;left:${pc(x.t)};width:${pc(Math.max(.4, x.e2 - x.t))}">${esc(x.txt)}</div>`).join('')}</div>
      <div class="trk" data-trk><span class="lbl">الكابشن</span>${sentences().map(ws => `<div class="blk cap" style="left:${pc(ws[0].s)};width:${pc(ws[ws.length - 1].e - ws[0].s)}">${esc(ws.map(w => w.t).join(' '))}</div>`).join('')}</div>
      <div class="trk" data-trk><span class="lbl">الفيديو</span><div class="img" style="background-image:url('/files/${N}/${D.tl.strip}')"></div></div>
      <div class="trk" data-trk><span class="lbl">الصوت</span><div class="img" style="background-image:url('/files/${N}/${D.tl.wave}')"></div></div>
      <div class="ph" id="ph"></div>${SEL ? `<div class="sel" style="left:${pc(SEL[0])};width:${pc(SEL[1] - SEL[0])}"></div>` : ''}</div>
      <div class="tlbar"><button class="mini" id="mi">[ بداية القص</button><button class="mini" id="mo">نهاية القص ]</button>
        <button class="btn" id="cx" ${SEL ? '' : 'disabled'} style="padding:8px 16px">✂️ احذف المحدد ${SEL ? `(${(SEL[1] - SEL[0]).toFixed(1)} ث)` : ''}</button>
        <span class="hint" style="margin:0">اضغط على التايم لاين عشان تروح · حدد بداية ونهاية واحذف</span></div>`;
    const tlEl = box.querySelector('.tl');
    tlEl.style.position = 'relative'; tlEl.style.direction = 'ltr';
    box.querySelectorAll('[data-trk]').forEach(t => t.onclick = e => { const r = t.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * tot); });
    const v = vid();
    if (v) v.addEventListener('timeupdate', () => { const ph = $('#ph'); if (ph) ph.style.left = pc(v.currentTime); });
    $('#mi').onclick = () => { SEL = [now(), SEL ? Math.max(now() + .1, SEL[1]) : Math.min(tot, now() + 2)]; drawTL(); };
    $('#mo').onclick = () => { SEL = [SEL ? Math.min(SEL[0], now() - .1) : Math.max(0, now() - 2), now()]; drawTL(); };
    $('#cx').onclick = async () => {
      if (!SEL || !confirm(`أحذف من ${fmt(SEL[0])} إلى ${fmt(SEL[1])}؟`)) return;
      try { await post(`/api/projects/${N}/cut`, {a: SEL[0], b: SEL[1]}); SEL = null; await loadDoc(); } catch (e) { alert(e.message); }
    };
  }
  function draw() { drawTL(); bar(); ({text: drawText, els: drawEls, notes: drawNotes, check: drawCheck, pack: drawPack})[tab](); }
  function sentences() {
    const out = []; let cur = [];
    D.caps.words.forEach((w, i) => {
      const nx = D.caps.words[i + 1]; cur.push(w);
      if (!nx || nx.s - w.e > .45 || cur.length >= 9 || /[.!?؟،]$/.test(w.t)) { out.push(cur); cur = []; }
    });
    return out;
  }
  function drawText() {
    const S = sentences();
    $('#pane').innerHTML = `<p class="hint">اضغط كلمة عشان تروح لها · اضغط مرتين عشان تصححها أو تميّزها</p>` + S.map((ws, i) => `
      <div class="sent"><span class="tm" data-t="${ws[0].s}">${fmt(ws[0].s)}</span>
        <span class="ws">${ws.map(w => `<span class="w ${w.hot ? 'hot' : ''}" data-t="${w.s}" data-w="${esc(w.t)}">${esc(w.t)}</span>`).join(' ')}</span>
        <button class="mini" data-del="${i}" title="ملاحظة حذف لـ Claude">حذف</button></div>`).join('');
    $('#pane').querySelectorAll('[data-t]').forEach(e => e.onclick = () => seek(+e.dataset.t));
    $('#pane').querySelectorAll('.w').forEach(e => e.ondblclick = async () => {
      const to = prompt('صحّح الكلمة (اتركها نفسها لو تبي تميّزها بس):', e.dataset.w); if (to === null || !to.trim()) return;
      const hot = confirm('تبيها كلمة مميزة (تطلع بلون بارز)؟');
      await post(`/api/projects/${N}/fix`, {from: e.dataset.w, to: to.trim(), hot}).catch(x => alert(x.message));
      loadDoc();
    });
    $('#pane').querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
      const ws = S[+b.dataset.del];
      await post(`/api/projects/${N}/note`, {t: ws[0].s, text: `احذف هذي الجملة: «${ws.map(w => w.t).join(' ')}»`});
      b.textContent = '✓ انضافت للملاحظات'; b.disabled = true; D = await api(`/api/projects/${N}/doc`);
    });
  }
  const KINDS = {chapters: ['فصل', 'at', ['label']], stickers: ['ملصق', 'at', ['text']], hero: ['عنوان كبير', 'a', ['title', 'subtitle']],
                 broll: ['لقطة شاشة', 'a', ['tag']], strike: ['قائمة', 'a', []], fix: ['زوم', 'a', []]};
  function drawEls() {
    const T = D.timeline || {}, rows = [];
    Object.entries(KINDS).forEach(([k, [lb, tk, fs]]) => (T[k] || []).forEach(e => rows.push({k, lb, t: e[tk] || 0, fs, e})));
    rows.sort((a, b) => a.t - b.t);
    if (T.endCard) rows.push({k: 'endCard', lb: 'خاتمة', t: (D.caps.total || 0), fs: ['title', 'button'], e: T.endCard});
    $('#pane').innerHTML = `<p class="hint">عدّل النص مباشرة أو احذف العنصر · لإضافة عنصر جديد اكتب ملاحظة لـ Claude</p>` + (rows.map((r, j) => `
      <div class="el"><div class="k">${r.lb}<small data-t="${r.t}" style="cursor:pointer">${fmt(r.t)}</small></div>
        <div>${r.fs.map(f => `<input type="text" data-j="${j}" data-f="${f}" value="${esc(r.e[f] || '')}">`).join('') || '<span class="hint">—</span>'}</div>
        <button class="mini" data-x="${j}">حذف</button></div>`).join('') || '<p class="empty">ما فيه عناصر</p>');
    const save = () => post(`/api/projects/${N}/timeline`, T).then(() => { D.dirty = true; bar(); });
    $('#pane').querySelectorAll('small[data-t]').forEach(e => e.onclick = () => seek(+e.dataset.t));
    $('#pane').querySelectorAll('input[data-j]').forEach(inp => inp.onchange = () => { rows[+inp.dataset.j].e[inp.dataset.f] = inp.value; save(); });
    $('#pane').querySelectorAll('[data-x]').forEach(b => b.onclick = () => {
      const r = rows[+b.dataset.x]; if (!confirm(`أحذف «${r.lb}»؟`)) return;
      if (r.k === 'endCard') delete T.endCard; else T[r.k].splice(T[r.k].indexOf(r.e), 1);
      save().then(drawEls);
    });
  }
  // فيديو طويل → اختيار المقاطع
  function drawClips() {
    const sel = new Set(), box = $('#clips'); box.hidden = false;
    box.innerHTML = `<h2>أقوى المقاطع ✂️</h2><p class="hint">اضغط على المقطع لاختياره · ▶ يشغّل المقطع</p>
      <video id="cv" controls src="/files/${N}/src.mp4" style="max-height:45vh;margin-bottom:12px"></video>
      ${D.clips.map(c => `<div class="clip" data-id="${c.id}"><div class="sc">${c.score}<small>من 100</small></div>
        <div><h4>${esc(c.title)}</h4><div class="hk">«${esc(c.hook || '')}»</div><div class="wy">${esc(c.why || '')}</div><div>${(c.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
        <div class="hint" style="margin:6px 0 0"><button class="mini" data-play="${c.a}" data-end="${c.b}">▶ ${fmt(c.a)} – ${fmt(c.b)}</button> · ${Math.round(c.b - c.a)} ثانية ·
          البداية <button class="mini" data-adj="${c.id}" data-da="-2">−2</button><button class="mini" data-adj="${c.id}" data-da="2">+2</button>
          النهاية <button class="mini" data-adj="${c.id}" data-db="-2">−2</button><button class="mini" data-adj="${c.id}" data-db="2">+2</button></div></div></div>`).join('')}
      <button class="btn ghost" id="rs" style="width:100%;margin-bottom:10px">🔄 هات غيرها</button>
      <button class="btn" id="mk" style="width:100%" disabled>اصنع المقاطع المختارة</button><div id="made"></div>`;
    box.querySelectorAll('[data-adj]').forEach(x => x.onclick = async e => {
      e.stopPropagation();
      await post(`/api/projects/${N}/clip_adjust`, {id: +x.dataset.adj, da: +(x.dataset.da || 0), db: +(x.dataset.db || 0)});
      D = await api(`/api/projects/${N}/doc`); drawClips();
    });
    $('#rs').onclick = () => post(`/api/projects/${N}/rescan`).then(() => { box.hidden = true; tick(); }).catch(e => alert(e.message));
    const cv = $('#cv'); let end = 0;
    cv.ontimeupdate = () => { if (end && cv.currentTime >= end) { cv.pause(); end = 0; } };
    box.querySelectorAll('[data-play]').forEach(b => b.onclick = e => { e.stopPropagation(); cv.currentTime = +b.dataset.play; end = +b.dataset.end; cv.play(); });
    box.querySelectorAll('.clip').forEach(c => c.onclick = () => {
      const id = +c.dataset.id; sel.has(id) ? sel.delete(id) : sel.add(id); c.classList.toggle('on');
      $('#mk').disabled = !sel.size; $('#mk').textContent = sel.size ? `اصنع ${sel.size} مقاطع` : 'اصنع المقاطع المختارة';
    });
    $('#mk').onclick = async () => {
      $('#mk').disabled = true;
      try {
        const r = await post(`/api/projects/${N}/clips_make`, {ids: [...sel]});
        $('#made').innerHTML = `<p class="hint" style="margin-top:12px">✅ بديت — كل مقطع صار مشروع لحاله ويتسوّى بالدور:</p>` +
          r.made.map(m => `<a class="f" style="display:inline-block;margin:4px" href="/p/${encodeURIComponent(m)}">${esc(m)}</a>`).join('');
        $('#made').querySelectorAll('a').forEach(a => a.onclick = e => { e.preventDefault(); go(a.getAttribute('href')); });
      } catch (e) { alert(e.message); $('#mk').disabled = false; }
    };
  }
  // فحص المقطع
  function drawCheck() {
    const W = D.caps.words, tot = D.caps.total || 0, txt = W.map(w => w.t);
    const FILL = ['يعني', 'اه', 'آه', 'امم', 'ام', 'اممم', 'طيب', 'بس', 'كذا'];
    const fill = txt.filter(t => FILL.includes(t.replace(/[.,،؟!]/g, ''))).length;
    let rep = 0; txt.forEach((t, i) => { if (i && t === txt[i - 1]) rep++; });
    const wps = W.length / Math.max(tot, 1), first = W.filter(w => w.s < 3).map(w => w.t).join(' ');
    const T = D.timeline || {}, els = ['stickers', 'hero', 'broll', 'strike', 'chapters'].reduce((a, k) => a + (T[k] || []).length, 0);
    const gap = (() => { const ts = []; ['stickers', 'hero', 'broll', 'strike', 'chapters'].forEach(k => (T[k] || []).forEach(e => ts.push(e.at ?? e.a))); ts.push(0, tot); ts.sort((a, b) => a - b); return Math.max(...ts.slice(1).map((t, i) => t - ts[i])); })();
    const row = (n, v, c, h) => `<div class="chk"><span>${n}<div class="hint" style="margin:2px 0 0">${h}</div></span><b class="${c}">${v}</b></div>`;
    $('#pane').innerHTML =
      row('المدة', `${tot.toFixed(1)} ث`, tot <= 60 && tot >= 15 ? 'ok' : 'warn', 'تيك توك وريلز: الأفضل 30–45 ثانية · X: أقل من 2:20') +
      row('سرعة الكلام', `${wps.toFixed(1)} كلمة/ث`, wps >= 1.8 && wps <= 3.5 ? 'ok' : 'warn', 'المريح 2–3 كلمات بالثانية') +
      row('كلمات حشو', fill, fill <= 2 ? 'ok' : fill <= 5 ? 'warn' : 'bad', 'يعني، امم، آه… احذفها من تبويب النص') +
      row('كلمات مكررة ورا بعض', rep, rep ? 'warn' : 'ok', 'غالباً تلعثم — احذفه بملاحظة') +
      row('عناصر المونتاج', els, els >= Math.max(3, tot / 8) ? 'ok' : 'warn', 'عنصر كل 5–8 ثواني يمسك الانتباه') +
      row('أطول فترة بدون حركة', `${gap.toFixed(1)} ث`, gap <= 8 ? 'ok' : 'warn', 'إذا أكثر من 8 ثواني المشاهد ممكن يطلع') +
      `<div class="chk"><span>أول 3 ثواني (الهوك)<div class="hint" style="margin:2px 0 0">هل تمسك المشاهد؟ لازم تكون أقوى جملة</div></span></div><p style="color:var(--gold2);margin:8px 0 0">«${esc(first)}»</p>`;
  }
  // باقة النشر
  function drawPack() {
    const P = D.publish && Object.fromEntries(Object.entries(D.publish).map(([k, v]) => [k, String(v).replace(/^```\w*\n?|\n?```$/g, '')])), L = {tiktok: 'تيك توك / ريلز', tweet: 'تغريدة X', reply: 'رد التغريدة (الرابط)', telegram: 'قروب التليقرام'};
    $('#pane').innerHTML = (P ? Object.entries(L).filter(([k]) => P[k]).map(([k, l]) => `<div class="pk"><label>${l}<button class="mini" data-c="${k}">نسخ</button></label><pre>${esc(P[k])}</pre></div>`).join('') :
      `<p class="hint">Claude يكتب لك وصف تيك توك (بدون روابط)، وتغريدة مع رد فيه الرابط، ورسالة القروب.</p>`) +
      `<button class="btn ${P ? 'ghost' : ''}" id="mkp" style="width:100%">${P ? 'اكتبها من جديد' : 'اكتب باقة النشر ✍️'}</button>`;
    $('#pane').querySelectorAll('[data-c]').forEach(b => b.onclick = async () => {
      try { await navigator.clipboard.writeText(P[b.dataset.c]); b.textContent = '✓ تم النسخ'; } catch { alert('ما قدرت أنسخ — حدده وانسخه يدوي'); }
    });
    $('#mkp').onclick = () => post(`/api/projects/${N}/pack`).then(tick).catch(e => alert(e.message));
  }
  function drawNotes() {
    const pend = D.notes.filter(n => !n.done).length;
    $('#pane').innerHTML = `<p class="hint">وقّف الفيديو على اللحظة اللي تبيها واكتب ملاحظتك — Claude ينفّذها كلها مرة وحدة</p>
      <div class="ask" style="margin:0 0 12px"><textarea id="nt" placeholder="مثال: هنا حط ملصق «مجاني 100%»"></textarea><button class="btn ghost" id="add">أضف عند <span id="at">${fmt(now())}</span></button></div>
      ${D.notes.map(n => `<div class="nt ${n.done ? 'done' : ''}"><span class="tm" data-t="${n.t}">${fmt(n.t)}</span><span class="tx">${n.done ? '✅ ' : ''}${esc(n.text)}</span><button class="mini" data-d="${n.id}">×</button></div>`).join('') || '<p class="empty">ما فيه ملاحظات</p>'}
      ${pend ? `<button class="btn" id="runN" style="margin-top:14px;width:100%">نفّذ ${pend} ملاحظات بـ Claude</button>` : ''}`;
    const v = vid(); if (v) v.ontimeupdate = () => { const a = $('#at'); if (a) a.textContent = fmt(v.currentTime); };
    $('#add').onclick = async () => {
      const t = $('#nt').value.trim(); if (!t) return;
      await post(`/api/projects/${N}/note`, {t: now(), text: t}).catch(e => alert(e.message)); loadDoc();
    };
    $('#pane').querySelectorAll('.tm').forEach(e => e.onclick = () => seek(+e.dataset.t));
    $('#pane').querySelectorAll('[data-d]').forEach(b => b.onclick = () => post(`/api/projects/${N}/note`, {del: +b.dataset.d}).then(loadDoc));
    if (pend) $('#runN').onclick = () => post(`/api/projects/${N}/notes_run`).then(tick).catch(e => alert(e.message));
  }
  tick(); timer = setInterval(tick, 2000);
}

// ─────────── بوب الدورة ───────────
const COURSE = 'https://exlpur.com/pages/lp1304367330/504596195';
function coursePop(why) {
  let last = 0; try { last = +localStorage.getItem('asrarPop') || 0; } catch {}
  if (why !== 'done' && Date.now() - last < 864e5) return;   // مرة باليوم، ودايم بعد ما يجهز فيديو
  if ($('.offer-overlay')) return;
  try { localStorage.setItem('asrarPop', Date.now()); } catch {}
  const parts = Array.from({length: 10}, () => {
    const l = 5 + Math.random() * 90, sz = 4 + Math.random() * 5;
    return `<span class="particle" style="left:${l}%;width:${sz}px;height:${sz}px;animation-delay:${(Math.random() * 3).toFixed(2)}s;animation-duration:${(2.6 + Math.random() * 1.4).toFixed(2)}s"></span>`;
  }).join('');
  const d = document.createElement('div'); d.className = 'offer-overlay';
  d.innerHTML = `${parts}
    <div class="offer-card">
      <button class="offer-close" aria-label="إغلاق">✕</button>
      <span class="offer-kicker reveal">${why === 'done' ? '🎬 مبروك فيديوك جاهز' : '🔥 فرصة نادرة'}</span>
      <div class="offer-loss reveal">من 45 ريالاً ضائعة..</div>
      <div class="offer-headline reveal">إلى <span class="num" id="offerCounter">0</span> ريال مبيعات حقيقية</div>
      <div class="offer-proof reveal"><img src="/web/proof.png" alt="إثبات مبيعات حقيقي">
        <div class="offer-proof-cap">📊 إثباتات المبيعات الحقيقية — مبيعات شهر واحد</div></div>
      <div class="offer-body reveal">لا نبيعك <b>أحلامًا</b>، نبيعك <b>"السيستم"</b> الذي حقق هذه الأرقام أمام عينك. تعلم تجارة المنتجات الرقمية والأتمتة من الصفر حتى الاحتراف.</div>
      <div class="offer-price reveal"><span class="small">فرصة نادرة — احصل على الدورة الآن بـ</span>
        <span class="big">49 ريال فقط</span><span class="urgent">⏳ اليوم فقط — فرصة لن تتكرر</span></div>
      <a class="offer-cta reveal" href="${COURSE}" target="_blank" rel="noopener">سجل الآن</a>
      <button class="offer-skip reveal">لا شكرًا، أكمل بدونها</button>
    </div>`;
  d.onclick = e => { if (e.target === d || e.target.matches('.offer-close,.offer-skip,.offer-cta')) d.remove(); };
  document.body.append(d);
  const el = $('#offerCounter'), t0 = performance.now();
  (function step(n) { const p = Math.min((n - t0) / 1500, 1); el.textContent = Math.floor((1 - Math.pow(1 - p, 3)) * 300000).toLocaleString('en-US'); if (p < 1) requestAnimationFrame(step); })(t0);
}
setTimeout(() => location.pathname === '/' && coursePop(), 6000);

route();
</script>
</body>
