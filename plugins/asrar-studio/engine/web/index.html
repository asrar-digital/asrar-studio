<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>أسرار ستوديو</title>
<style>
@font-face{font-family:T;src:url(/fonts/Tajawal-Medium.ttf);font-weight:500}
@font-face{font-family:T;src:url(/fonts/Tajawal-Bold.ttf);font-weight:700}
@font-face{font-family:T;src:url(/fonts/Tajawal-Black.ttf);font-weight:900}
:root{--bg:#070707;--card:#121110;--line:#2a2620;--gold:#D4A84B;--gold2:#F3D28C;--txt:#F7F1E4;--mut:#9b927f;--ok:#7bd88f;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:500 16px/1.6 T,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 80px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}
.logo{font-weight:900;font-size:24px}.logo b{color:var(--gold)}
.pill{font-size:13px;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:4px 12px}
.btn{background:var(--gold);color:#111;border:0;border-radius:14px;padding:12px 22px;font-weight:900;cursor:pointer}
.btn:hover{background:var(--gold2)}.btn:disabled{opacity:.4;cursor:default}
.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}.ghost:hover{background:#1b1915}
h1{font-weight:900;font-size:30px;margin:0 0 6px}h2{font-weight:900;font-size:20px;margin:0 0 14px}
.sub{color:var(--mut);margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.pc{cursor:pointer;transition:.15s}.pc:hover{border-color:var(--gold);transform:translateY(-2px)}
.pc .th{aspect-ratio:9/12;background:#000 center/cover;display:grid;place-items:center;color:var(--line);font-size:40px}
.pc .in{padding:12px 14px}.pc .nm{font-weight:700}
.st{font-size:13px;color:var(--mut)}.st.ok{color:var(--ok)}.st.run{color:var(--gold)}.st.error{color:var(--bad)}
.new{display:grid;place-items:center;min-height:260px;border:2px dashed var(--line);color:var(--mut);cursor:pointer;border-radius:22px;font-weight:700}
.new:hover{border-color:var(--gold);color:var(--gold)}
.box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;margin-bottom:18px}
.drop{border:2px dashed var(--line);border-radius:18px;padding:36px;text-align:center;color:var(--mut);cursor:pointer}
.drop.on{border-color:var(--gold);color:var(--gold)}
.files{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.f{background:#1b1915;border-radius:10px;padding:6px 12px;font-size:14px}
label.q{display:block;font-weight:700;margin:18px 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{border:1px solid var(--line);border-radius:14px;padding:10px 16px;cursor:pointer;background:#0d0c0b}
.opt.on{border-color:var(--gold);background:#2a2110;color:var(--gold2)}
.opt small{display:block;color:var(--mut);font-size:12px}
input[type=text],textarea{width:100%;background:#0d0c0b;border:1px solid var(--line);border-radius:12px;padding:12px}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--gold)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.two{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;align-items:center;gap:12px;padding:10px 0;color:var(--mut)}
.steps i{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:13px;flex:none}
.steps li.done{color:var(--txt)}.steps li.done i{background:var(--gold);border-color:var(--gold);color:#111}
.steps li.now{color:var(--gold2);font-weight:700}.steps li.now i{border-color:var(--gold);animation:p 1.2s infinite}
.steps li.err{color:var(--bad)}.steps li.err i{border-color:var(--bad)}
@keyframes p{50%{box-shadow:0 0 0 6px #d4a84b33}}
.log{height:360px;overflow:auto;background:#0b0a09;border-radius:14px;padding:12px;font-size:14px}
.log div{padding:4px 0;border-bottom:1px solid #17150f}
.log .claude{color:var(--gold2)}.log .claude:before{content:"Claude: ";font-weight:900;color:var(--gold)}
.log .tool{color:var(--mut);font-size:12px;direction:ltr;text-align:left}
.log .user{color:#9cd2ff}.log .user:before{content:"أنت: ";font-weight:900}
.log .error{color:var(--bad)}.log .debug{display:none}
video{width:100%;border-radius:16px;background:#000;max-height:70vh}
.prev{width:100%;border-radius:12px;margin-top:10px}
.outs a{display:flex;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-top:8px}
.outs a:hover{border-color:var(--gold)}
.ask{display:flex;gap:10px;margin-top:12px}.ask textarea{height:52px;resize:vertical}
.err{background:#2a1212;border:1px solid #5a2222;color:#ffb3b3;border-radius:12px;padding:10px 14px;margin:10px 0}
.empty{color:var(--mut);text-align:center;padding:40px}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tab{padding:8px 16px;border-radius:12px;cursor:pointer;color:var(--mut);border:1px solid transparent}
.tab.on{color:var(--gold2);border-color:var(--gold);background:#2a2110}
.sent{padding:10px 0;border-bottom:1px solid #1d1a15;display:flex;gap:10px;align-items:flex-start}
.sent .tm{color:var(--mut);font-size:12px;direction:ltr;min-width:42px;cursor:pointer}
.sent .ws{flex:1;line-height:2}.w{cursor:pointer;border-radius:6px;padding:1px 3px}.w:hover{background:#2a2110}
.w.hot{color:#111;background:var(--gold)}
.mini{background:none;border:1px solid var(--line);border-radius:9px;color:var(--mut);padding:3px 9px;cursor:pointer;font-size:12px}
.mini:hover{color:var(--bad);border-color:var(--bad)}
.el{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #1d1a15}
.el .k{font-size:12px;color:var(--gold)}.el .k small{display:block;color:var(--mut);direction:ltr;text-align:right}
.el input{padding:7px 10px!important;font-size:14px;margin:2px 0}
.nt{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #1d1a15}.nt.done{opacity:.5}
.nt .tm{direction:ltr;color:var(--gold);cursor:pointer;min-width:42px}.nt .tx{flex:1}
.dirty{background:#2a2110;border:1px solid var(--gold);border-radius:14px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.hint{color:var(--mut);font-size:13px;margin:0 0 10px}
.pop{position:fixed;inset:0;background:#000c;display:grid;place-items:center;z-index:9;padding:16px;animation:f .3s}
@keyframes f{from{opacity:0}}
.pop .in{background:linear-gradient(160deg,#1a1408,#0b0a09);border:1px solid var(--gold);border-radius:26px;max-width:440px;padding:30px 26px;text-align:center;position:relative}
.pop .x{position:absolute;top:12px;left:14px;background:none;border:0;color:var(--mut);font-size:22px;cursor:pointer}
.pop .tg{display:inline-block;background:#2a2110;color:var(--gold2);border-radius:99px;padding:4px 14px;font-size:13px;margin-bottom:12px}
.pop h3{font-weight:900;font-size:24px;margin:0 0 10px}.pop h3 b{color:var(--gold)}
.pop p{color:var(--mut);margin:0 0 20px}.pop ul{list-style:none;padding:0;margin:0 0 22px;text-align:right}
.pop li{padding:5px 0}.pop li:before{content:"✦ ";color:var(--gold)}
.pop .btn{display:block;width:100%}.pop .later{display:block;margin-top:10px;color:var(--mut);font-size:14px;cursor:pointer;background:none;border:0;width:100%}
@media(max-width:800px){.two,.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="/">أسرار <b>ستوديو</b></a>
    <span class="pill" id="cl">…</span>
  </header>
  <main id="app"></main>
</div>
<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api = async (u, o = {}) => { const r = await fetch(u, o); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || 'خطأ'); return j; };
const post = (u, b) => api(u, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(b || {})});
const STL = {upload: 'بانتظار المقاطع', transcribe: 'تفريغ', cut: 'قص', plan: 'Claude يخطط', preview: 'معاينة', render: 'تصدير', done: 'جاهز'};
let timer = null;

api('/api/ping').then(p => $('#cl').textContent = p.claude ? '● Claude متصل' : '○ Claude غير مثبت').catch(() => {});

function route() {
  clearInterval(timer);
  const m = location.pathname.match(/^\/p\/(.+)$/);
  m ? project(decodeURIComponent(m[1])) : library();
}
window.onpopstate = route;
function go(u) { history.pushState(0, '', u); route(); }

// ─────────── المكتبة ───────────
async function library() {
  const list = await api('/api/projects');
  $('#app').innerHTML = `
    <h1>مشاريعك</h1><p class="sub">كل شي يشتغل على جهازك — ارفع مقاطعك و Claude يسوي المونتاج.</p>
    <div class="grid">
      <div class="new" id="nw"><div style="text-align:center"><div style="font-size:42px">+</div>مشروع جديد</div></div>
      ${list.map(p => `
        <div class="card pc" data-n="${esc(p.name)}">
          <div class="th" style="${p.thumb ? `background-image:url('/files/${encodeURIComponent(p.name)}/thumb.jpg')` : ''}">${p.thumb ? '' : '🎬'}</div>
          <div class="in"><div class="nm">${esc(p.name)}</div>
          <div class="st ${p.status.state}">${p.status.state === 'error' ? '⚠️ توقف' : STL[p.status.stage] || ''}${p.outputs.length ? ' · ' + p.outputs.length + ' ملفات' : ''}</div></div>
        </div>`).join('')}
    </div>`;
  $('#nw').onclick = async () => {
    const name = prompt('اسم المشروع:', 'مقطع جديد'); if (!name) return;
    const r = await post('/api/projects', {name}); go('/p/' + encodeURIComponent(r.name));
  };
  document.querySelectorAll('.pc').forEach(c => c.onclick = () => go('/p/' + encodeURIComponent(c.dataset.n)));
}

// ─────────── المشروع ───────────
async function project(name) {
  const P = await api('/api/projects/' + encodeURIComponent(name));
  if (P.status.stage === 'upload' && P.status.state !== 'run') return setup(P);
  progress(P);
}

// صفحة الرفع + الأسئلة
function setup(P) {
  const b = Object.assign({style: 'editorial', type: 'شرح أداة', platform: 'tiktok', title: P.name, end: '', account: '@asrar_rg', notes: ''}, P.brief);
  const opt = (k, v, t, s = '') => `<div class="opt ${b[k] === v ? 'on' : ''}" data-k="${k}" data-v="${esc(v)}">${t}${s ? `<small>${s}</small>` : ''}</div>`;
  $('#app').innerHTML = `
    <h1>${esc(P.name)}</h1><p class="sub">ارفع المقاطع وجاوب على الأسئلة — بعدها اضغط «ابدأ المونتاج».</p>
    ${P.status.error ? `<div class="err">${esc(P.status.error)}</div>` : ''}
    <div class="box"><h2>١. المقاطع</h2>
      <div class="drop" id="dz">اسحب مقاطعك هنا أو اضغط للاختيار<br><small>تنرتب حسب ترتيب الاختيار</small></div>
      <input type="file" id="fi" accept="video/*" multiple hidden>
      <div class="files" id="fl">${P.inputs.map(f => `<span class="f">✅ ${esc(f.replace(/^\d+_/, ''))}</span>`).join('')}</div>
    </div>
    <div class="box"><h2>٢. الأسئلة</h2>
      <label class="q">نوع المقطع</label><div class="opts">
        ${['شرح أداة', 'إعلان', 'قصة', 'نصيحة', 'خبر'].map(v => opt('type', v, v)).join('')}</div>
      <label class="q">الستايل</label><div class="opts">
        ${opt('style', 'editorial', 'إديتوريال', 'أسود وبرتقالي — جريء')}${opt('style', 'gold', 'ذهبي', 'أسود وذهبي — فخم')}</div>
      <label class="q">المنصة الأساسية</label><div class="opts">
        ${opt('platform', 'tiktok', 'تيك توك / ريلز')}${opt('platform', 'x', 'X')}</div>
      <div class="row">
        <div><label class="q">عنوان المقطع</label><input type="text" id="title" value="${esc(b.title)}"></div>
        <div><label class="q">اسم الحساب</label><input type="text" id="account" value="${esc(b.account)}"></div>
      </div>
      <label class="q">نص النهاية (اختياري)</label><input type="text" id="end" value="${esc(b.end)}" placeholder="مثال: تابعني لأسرار أكثر">
      <label class="q">ملاحظات لـ Claude (اختياري)</label><textarea id="notes" rows="3" placeholder="مثال: ركّز على الأرقام، وخلّ الهوك قوي">${esc(b.notes)}</textarea>
    </div>
    <button class="btn" id="go" ${P.inputs.length ? '' : 'disabled'}>ابدأ المونتاج 🎬</button>`;
  document.querySelectorAll('.opt').forEach(o => o.onclick = () => {
    b[o.dataset.k] = o.dataset.v;
    document.querySelectorAll(`.opt[data-k="${o.dataset.k}"]`).forEach(x => x.classList.toggle('on', x === o));
  });
  const dz = $('#dz'), fi = $('#fi');
  dz.onclick = () => fi.click();
  dz.ondragover = e => { e.preventDefault(); dz.classList.add('on'); };
  dz.ondragleave = () => dz.classList.remove('on');
  dz.ondrop = e => { e.preventDefault(); dz.classList.remove('on'); upload([...e.dataTransfer.files]); };
  fi.onchange = () => upload([...fi.files]);
  let n = P.inputs.length;
  async function upload(files) {
    for (const f of files.filter(f => f.type.startsWith('video/') || /\.(mp4|mov|mkv|webm)$/i.test(f.name))) {
      const el = document.createElement('span'); el.className = 'f'; $('#fl').append(el);
      await new Promise((ok, bad) => {
        const x = new XMLHttpRequest();
        x.open('PUT', `/api/projects/${encodeURIComponent(P.name)}/upload?i=${n++}&file=${encodeURIComponent(f.name)}`);
        x.upload.onprogress = e => el.textContent = `⏳ ${f.name} ${Math.round(e.loaded / e.total * 100)}%`;
        x.onload = () => { el.textContent = '✅ ' + f.name; ok(); };
        x.onerror = () => { el.textContent = '❌ ' + f.name; bad(); };
        x.send(f);
      }).catch(() => {});
    }
    $('#go').disabled = !$('#fl').children.length;
  }
  $('#go').onclick = async () => {
    ['title', 'account', 'end', 'notes'].forEach(k => b[k] = $('#' + k).value.trim());
    $('#go').disabled = true; $('#go').textContent = 'أجهّز المقاطع…';
    try {
      await post(`/api/projects/${encodeURIComponent(P.name)}/brief`, b);
      await post(`/api/projects/${encodeURIComponent(P.name)}/start`, {from: 'transcribe'});
      project(P.name);
    } catch (e) { alert(e.message); $('#go').disabled = false; $('#go').textContent = 'ابدأ المونتاج 🎬'; }
  };
}

// صفحة التقدم المباشر
async function progress(P) {
  const N = encodeURIComponent(P.name);
  const stages = await api(`/api/projects/${N}/stages`);
  $('#app').innerHTML = `
    <h1>${esc(P.name)}</h1><p class="sub" id="msg"></p>
    <div class="two">
      <div>
        <div class="box"><h2>المراحل</h2><ul class="steps" id="steps"></ul>
          <div id="actions" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"></div></div>
      </div>
      <div>
        <div class="box" id="result" hidden></div>
        <div class="box" id="studio" hidden><h2>الاستوديو</h2><div id="dbar"></div>
          <div class="tabs"><span class="tab on" data-t="text">النص</span><span class="tab" data-t="els">العناصر</span><span class="tab" data-t="notes">الملاحظات</span></div>
          <div id="pane"></div></div>
        <div class="box"><h2>سجل العمل</h2><div class="log" id="log"></div>
          <div class="ask"><textarea id="ask" placeholder="اطلب تعديل… مثال: كبّر الكابشن شوي، واحذف أول ٣ ثواني"></textarea>
          <button class="btn" id="send">نفّذ</button></div></div>
      </div>
    </div>`;
  let since = 0, lastKey = '';
  $('#send').onclick = async () => {
    const t = $('#ask').value.trim(); if (!t) return;
    try { await post(`/api/projects/${N}/ask`, {text: t}); $('#ask').value = ''; tick(); } catch (e) { alert(e.message); }
  };
  async function tick() {
    let p; try { p = await api(`/api/projects/${N}`); } catch { return; }
    const st = p.status, idx = stages.findIndex(s => s[0] === st.stage);
    $('#msg').textContent = st.msg || '';
    $('#steps').innerHTML = stages.map(([k, t], i) => {
      let c = i < idx || st.stage === 'done' ? 'done' : i === idx ? (st.state === 'error' ? 'err' : st.state === 'run' ? 'now' : 'done') : '';
      return `<li class="${c}"><i>${c === 'done' ? '✓' : c === 'err' ? '!' : i + 1}</i>${t}</li>`;
    }).join('');
    const act = $('#actions');
    const key = st.state + p.running;
    if (key !== lastKey) {
      lastKey = key; if (!p.running) loadDoc();
      act.innerHTML = '';
      const b = (t, f, g) => { const e = document.createElement('button'); e.className = 'btn' + (g ? ' ghost' : ''); e.textContent = t; e.onclick = f; act.append(e); };
      if (!p.running && st.state === 'error') b('أعد المحاولة من هنا', () => post(`/api/projects/${N}/start`, {from: st.stage === 'upload' ? 'transcribe' : st.stage}).then(tick).catch(e => alert(e.message)));
      if (!p.running) b('↩️ تراجع', () => post(`/api/projects/${N}/undo`).then(() => alert('رجّعت آخر نسخة — اضغط «أعد التصدير»')).catch(e => alert(e.message)), 1);
      if (!p.running && st.stage === 'done') b('أعد التصدير', () => post(`/api/projects/${N}/start`, {from: 'preview'}).then(tick), 1);
      if (p.outputs.length) b('📂 افتح المجلد', () => post(`/api/projects/${N}/open`), 1);
    }
    $('#send').disabled = p.running;
    const r = $('#result');
    const prevKey = (p.outputs.join() || '') + (p.preview || '') + st.stage;
    if (r.dataset.k !== prevKey) {
      r.dataset.k = prevKey;
      const main = p.outputs.find(o => o.includes('تيك')) || p.outputs[0];
      if (main && st.stage === 'done') {
        r.hidden = false; setTimeout(() => coursePop('done'), 2500);
        r.innerHTML = `<h2>الفيديو جاهز 🎬</h2><video id="vid" controls src="/files/${N}/out/${encodeURIComponent(main)}?v=${Date.now()}"></video>
          <div class="outs">${p.outputs.map(o => `<a href="/files/${N}/out/${encodeURIComponent(o)}?download=1"><span>${esc(o)}</span><span>⬇️ تحميل</span></a>`).join('')}</div>`;
      } else if (p.preview) {
        r.hidden = false;
        r.innerHTML = `<h2>المعاينة</h2><img class="prev" src="/files/${N}/preview.jpg?v=${Date.now()}">`;
      }
    }
    const lg = await api(`/api/projects/${N}/log?since=${since}`).catch(() => []);
    if (lg.length) {
      const box = $('#log'), atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
      lg.forEach(e => { since = Math.max(since, e.t); const d = document.createElement('div'); d.className = e.who; d.textContent = e.text; box.append(d); });
      if (atEnd) box.scrollTop = box.scrollHeight;
    }
  }

  // ─── الاستوديو: النص · العناصر · الملاحظات ───
  let D = null, tab = 'text';
  const vid = () => $('#vid'), now = () => vid() ? vid().currentTime : 0;
  const seek = t => { const v = vid(); if (v) { v.currentTime = t; v.play(); } };
  const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => { tab = t.dataset.t; document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t)); draw(); });
  async function loadDoc() {
    D = await api(`/api/projects/${N}/doc`).catch(() => null);
    if (!D || !(D.caps.words || []).length) return;
    $('#studio').hidden = false; draw();
  }
  function bar() {
    $('#dbar').innerHTML = D.dirty ? `<div class="dirty"><span>عندك تعديلات ما انطبقت</span><button class="btn" id="rb">طبّق وأعد التصدير</button></div>` : '';
    if (D.dirty) $('#rb').onclick = () => post(`/api/projects/${N}/rebuild`).then(() => { D.dirty = false; bar(); tick(); }).catch(e => alert(e.message));
  }
  function draw() { bar(); ({text: drawText, els: drawEls, notes: drawNotes})[tab](); }
  function sentences() {
    const out = []; let cur = [];
    D.caps.words.forEach((w, i) => {
      const nx = D.caps.words[i + 1]; cur.push(w);
      if (!nx || nx.s - w.e > .45 || cur.length >= 9 || /[.!?؟،]$/.test(w.t)) { out.push(cur); cur = []; }
    });
    return out;
  }
  function drawText() {
    const S = sentences();
    $('#pane').innerHTML = `<p class="hint">اضغط كلمة عشان تروح لها · اضغط مرتين عشان تصححها أو تميّزها</p>` + S.map((ws, i) => `
      <div class="sent"><span class="tm" data-t="${ws[0].s}">${fmt(ws[0].s)}</span>
        <span class="ws">${ws.map(w => `<span class="w ${w.hot ? 'hot' : ''}" data-t="${w.s}" data-w="${esc(w.t)}">${esc(w.t)}</span>`).join(' ')}</span>
        <button class="mini" data-del="${i}" title="ملاحظة حذف لـ Claude">حذف</button></div>`).join('');
    $('#pane').querySelectorAll('[data-t]').forEach(e => e.onclick = () => seek(+e.dataset.t));
    $('#pane').querySelectorAll('.w').forEach(e => e.ondblclick = async () => {
      const to = prompt('صحّح الكلمة (اتركها نفسها لو تبي تميّزها بس):', e.dataset.w); if (to === null || !to.trim()) return;
      const hot = confirm('تبيها كلمة مميزة (تطلع بلون بارز)؟');
      await post(`/api/projects/${N}/fix`, {from: e.dataset.w, to: to.trim(), hot}).catch(x => alert(x.message));
      loadDoc();
    });
    $('#pane').querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
      const ws = S[+b.dataset.del];
      await post(`/api/projects/${N}/note`, {t: ws[0].s, text: `احذف هذي الجملة: «${ws.map(w => w.t).join(' ')}»`});
      b.textContent = '✓ انضافت للملاحظات'; b.disabled = true; D = await api(`/api/projects/${N}/doc`);
    });
  }
  const KINDS = {chapters: ['فصل', 'at', ['label']], stickers: ['ملصق', 'at', ['text']], hero: ['عنوان كبير', 'a', ['title', 'subtitle']],
                 broll: ['لقطة شاشة', 'a', ['tag']], strike: ['قائمة', 'a', []], fix: ['زوم', 'a', []]};
  function drawEls() {
    const T = D.timeline || {}, rows = [];
    Object.entries(KINDS).forEach(([k, [lb, tk, fs]]) => (T[k] || []).forEach(e => rows.push({k, lb, t: e[tk] || 0, fs, e})));
    rows.sort((a, b) => a.t - b.t);
    if (T.endCard) rows.push({k: 'endCard', lb: 'خاتمة', t: (D.caps.total || 0), fs: ['title', 'button'], e: T.endCard});
    $('#pane').innerHTML = `<p class="hint">عدّل النص مباشرة أو احذف العنصر · لإضافة عنصر جديد اكتب ملاحظة لـ Claude</p>` + (rows.map((r, j) => `
      <div class="el"><div class="k">${r.lb}<small data-t="${r.t}" style="cursor:pointer">${fmt(r.t)}</small></div>
        <div>${r.fs.map(f => `<input type="text" data-j="${j}" data-f="${f}" value="${esc(r.e[f] || '')}">`).join('') || '<span class="hint">—</span>'}</div>
        <button class="mini" data-x="${j}">حذف</button></div>`).join('') || '<p class="empty">ما فيه عناصر</p>');
    const save = () => post(`/api/projects/${N}/timeline`, T).then(() => { D.dirty = true; bar(); });
    $('#pane').querySelectorAll('small[data-t]').forEach(e => e.onclick = () => seek(+e.dataset.t));
    $('#pane').querySelectorAll('input[data-j]').forEach(inp => inp.onchange = () => { rows[+inp.dataset.j].e[inp.dataset.f] = inp.value; save(); });
    $('#pane').querySelectorAll('[data-x]').forEach(b => b.onclick = () => {
      const r = rows[+b.dataset.x]; if (!confirm(`أحذف «${r.lb}»؟`)) return;
      if (r.k === 'endCard') delete T.endCard; else T[r.k].splice(T[r.k].indexOf(r.e), 1);
      save().then(drawEls);
    });
  }
  function drawNotes() {
    const pend = D.notes.filter(n => !n.done).length;
    $('#pane').innerHTML = `<p class="hint">وقّف الفيديو على اللحظة اللي تبيها واكتب ملاحظتك — Claude ينفّذها كلها مرة وحدة</p>
      <div class="ask" style="margin:0 0 12px"><textarea id="nt" placeholder="مثال: هنا حط ملصق «مجاني 100%»"></textarea><button class="btn ghost" id="add">أضف عند <span id="at">${fmt(now())}</span></button></div>
      ${D.notes.map(n => `<div class="nt ${n.done ? 'done' : ''}"><span class="tm" data-t="${n.t}">${fmt(n.t)}</span><span class="tx">${n.done ? '✅ ' : ''}${esc(n.text)}</span><button class="mini" data-d="${n.id}">×</button></div>`).join('') || '<p class="empty">ما فيه ملاحظات</p>'}
      ${pend ? `<button class="btn" id="runN" style="margin-top:14px;width:100%">نفّذ ${pend} ملاحظات بـ Claude</button>` : ''}`;
    const v = vid(); if (v) v.ontimeupdate = () => { const a = $('#at'); if (a) a.textContent = fmt(v.currentTime); };
    $('#add').onclick = async () => {
      const t = $('#nt').value.trim(); if (!t) return;
      await post(`/api/projects/${N}/note`, {t: now(), text: t}).catch(e => alert(e.message)); loadDoc();
    };
    $('#pane').querySelectorAll('.tm').forEach(e => e.onclick = () => seek(+e.dataset.t));
    $('#pane').querySelectorAll('[data-d]').forEach(b => b.onclick = () => post(`/api/projects/${N}/note`, {del: +b.dataset.d}).then(loadDoc));
    if (pend) $('#runN').onclick = () => post(`/api/projects/${N}/notes_run`).then(tick).catch(e => alert(e.message));
  }
  tick(); timer = setInterval(tick, 2000);
}

// ─────────── بوب الدورة ───────────
function coursePop(why) {
  let last = 0; try { last = +localStorage.getItem('asrarPop') || 0; } catch {}
  if (why !== 'done' && Date.now() - last < 864e5) return;   // مرة باليوم، ودايم بعد ما يجهز فيديو
  if ($('.pop')) return;
  try { localStorage.setItem('asrarPop', Date.now()); } catch {}
  const d = document.createElement('div'); d.className = 'pop';
  d.innerHTML = `<div class="in"><button class="x" aria-label="إغلاق">×</button>
    <span class="tg">${why === 'done' ? 'مبروك فيديوك جاهز 🎬' : 'من صانع أسرار ستوديو'}</span>
    <h3>خلّ محتواك <b>يبيع</b> لك</h3>
    <p>من 45 ريال إلى +300 ألف ريال مبيعات — تعلّم السيستم كامل لبيع المنتجات الرقمية من الصفر.</p>
    <ul><li>اختيار منتجك الأول بدون رأس مال</li><li>بناء متجرك على سلة أو زد</li><li>التسويق بتيك توك وإنستقرام وجلب العملاء يومياً</li><li>بكج مجاني: +24 منتج رقمي جاهز للبيع</li></ul>
    <div style="margin:-8px 0 16px;color:var(--gold2);font-weight:900">الدورة كاملة (11 جزء) بـ 49 ريال فقط</div>
    <a class="btn" href="https://asrar-digital.com/course" target="_blank" rel="noopener">اكتشف الدورة ←</a>
    <button class="later">لاحقاً</button></div>`;
  d.onclick = e => { if (e.target === d || e.target.matches('.x,.later')) d.remove(); };
  document.body.append(d);
}
setTimeout(() => location.pathname === '/' && coursePop(), 6000);

route();
</script>
